# TODO: Move memcached password over to the umc-server chart

{{- $nubusMasterPassword := include "nubusTemplates.masterPassword" . -}}
{{- /*
  The <release>-nubus-credentials Secret (administrator_password) is only
  emitted when nubusStackDataUms.administratorPasswordSecret.create is true
  (the default). Set it to false to bring your own Secret of the same name
  and key — e.g. from an external secret manager — so that no credential is
  baked into the rendered manifests.
*/ -}}
{{- $createAdminSecret := dig "administratorPasswordSecret" "create" true .Values.nubusStackDataUms -}}
{{- $nubusSecrets := list -}}
{{- if $createAdminSecret -}}
{{- $nubusSecrets = append $nubusSecrets (dict "name" "nubus-credentials" "stringData" (dict
    "administrator_password" (tpl .Values.nubusStackDataUms.templateContext.initialPasswordAdministrator . | quote )
  )) -}}
{{- end -}}
{{- $nubusSecrets = append $nubusSecrets (dict "name" "provisioning-udm-listener-ldap-tls" "stringData" (dict
    "ca.crt" ""
    "tls.key" ""
    "tls.crt" ""
  )) -}}

{{- range $secret := $nubusSecrets }}
---
kind: "Secret"
apiVersion: "v1"
type: {{ .type | default "Opaque" | quote }}
metadata:
  name: {{ printf "%s-%s" $.Release.Name .name | quote }}
  namespace: {{ include "common.names.namespace" $ | quote }}
  labels:
    {{- include "common.labels.standard" $ | nindent 4 }}
    {{- if $.Values.additionalLabels }}
    {{- include "common.tplvalues.render" ( dict "value" $.Values.additionalLabels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if $.Values.additionalAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" $.Values.additionalAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
{{- if .data }}
data:
{{- range $k, $v := .data }}
  {{ $k }}: {{ $v | quote }}
{{- end }}
{{- end }}
{{- if .stringData }}
stringData:
{{- range $k, $v := .stringData }}
  {{ $k }}: {{ $v }}
{{- end }}
{{- end }}
...
{{- end }}
