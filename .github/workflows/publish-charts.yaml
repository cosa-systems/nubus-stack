---
# Publish the nubus umbrella chart to ghcr.io/${{ github.repository_owner }}
# (i.e. ghcr.io/cosa-systems).
#
# Trigger:
#   * push to `cosa-deploy` (auto-publish on every commit there)
#   * workflow_dispatch (manual button in the Actions UI)
#
# Chart version is read from helm/nubus/Chart.yaml. Bump the `-cosa.N`
# suffix there to ship a new build.
name: "Publish helm charts"

on:
  push:
    branches:
      - "cosa-deploy"
    paths:
      - "helm/nubus/**"
      - ".github/workflows/publish-charts.yaml"
  workflow_dispatch:

permissions:
  contents: "read"
  packages: "write"

jobs:
  publish:
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"

      - name: "Set up Helm"
        uses: "azure/setup-helm@v4"
        with:
          version: "v3.16.4"

      - name: "Log in to ghcr.io"
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" \
            | helm registry login ghcr.io \
                --username "${{ github.actor }}" \
                --password-stdin

      - name: "Resolve chart dependencies"
        # Anonymous read from ghcr.io/cosa-systems for our forked
        # stack-data-ums; everything else comes from Univention's
        # canonical OCI registry.
        run: |
          helm dependency update helm/nubus

      - name: "Package chart"
        id: "package"
        run: |
          mkdir -p out
          helm package helm/nubus --destination out
          tgz=$(ls out/nubus-*.tgz)
          echo "tgz=${tgz}" >> "${GITHUB_OUTPUT}"
          version=$(echo "${tgz}" \
            | sed -nE 's|.*/nubus-(.+)\.tgz|\1|p')
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: "Push to ghcr.io/${{ github.repository_owner }}"
        run: |
          # Owner has to be lowercase for OCI references.
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          helm push "${{ steps.package.outputs.tgz }}" "oci://ghcr.io/${owner}"
          echo
          echo "Published: oci://ghcr.io/${owner}/nubus:${{ steps.package.outputs.version }}"
